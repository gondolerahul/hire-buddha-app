{{- if .Values.tenantRuntimeRbac.enabled }}
{{- /*
The tenant runtime's cluster-wide rights (Phase 14 WS6, slice 4): the API and
workers make sandbox pods, their secrets and network policies, TenantApp
objects and checks Jobs in t-* namespaces; the App Controller turns TenantApps
into Deployments, Services, policies and scalers there. Here, not in
hb-platform, because the deploy pipeline's identity may change only its own
namespaces (moved 21 Oct 2026).
*/}}
---
# The API and workers: sandbox pods, their secrets and network policy, TenantApp
# objects and app secrets in t-* namespaces; pod logs; checks Jobs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hb-platform-tenant-runtime
  labels:
    {{- include "hbb.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, create, update, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, delete]
  - apiGroups: [hirebuddha.com]
    resources: [tenantapps]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hb-platform-tenant-runtime
  labels:
    {{- include "hbb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hb-platform-tenant-runtime
subjects:
  - kind: ServiceAccount
    name: sa-api
    namespace: {{ .Values.namespaces.platform }}
  - kind: ServiceAccount
    name: sa-worker
    namespace: {{ .Values.namespaces.platform }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hb-app-controller
  labels:
    {{- include "hbb.labels" . | nindent 4 }}
rules:
  - apiGroups: [hirebuddha.com]
    resources: [tenantapps, tenantapps/status]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [""]
    resources: [services, serviceaccounts, configmaps, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [http.keda.sh]
    resources: [httpscaledobjects]
    verbs: [get, list, create, update, patch, delete]
  # kopf's own bookkeeping
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hb-app-controller
  labels:
    {{- include "hbb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hb-app-controller
subjects:
  - kind: ServiceAccount
    name: hb-app-controller
    namespace: {{ .Values.namespaces.platform }}
{{- end }}
