{{- $ns := .Values.namespaces }}
# The platform namespace (tech spec §4.3) and Pragya's reserved one (PR-8).
# The release's own namespace (hb-system) is created by install.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns.platform }}
  labels:
    {{- include "hbb.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
  annotations:
    helm.sh/resource-policy: keep
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns.pragya }}
  labels:
    {{- include "hbb.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
  annotations:
    helm.sh/resource-policy: keep
---
# Pragya's runtime slot is empty in Phase 14: nothing may run there or reach out yet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $ns.pragya }}
  labels:
    {{- include "hbb.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
