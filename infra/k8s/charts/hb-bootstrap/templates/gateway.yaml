{{- if .Values.gateway.enabled }}
{{- $g := .Values.gateway }}
# The platform's entry (tech spec §12.5, guide §9.5): Envoy Gateway behind one
# static IP, an HTTPS listener per platform hostname with a certificate from
# cert-manager, HTTP only for ACME challenges and the redirect to HTTPS.
# hb-platform's HTTPRoutes attach to the HTTPS listeners.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: platform-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hbb.labels" . | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
      envoyService:
        # Local: the API sees the caller's address (per-IP rate limits, webhook logs).
        externalTrafficPolicy: Local
        {{- with $g.serviceAnnotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ $g.className }}
  labels:
    {{- include "hbb.labels" . | nindent 4 }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: platform-proxy
    namespace: {{ .Release.Namespace }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $g.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hbb.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $g.clusterIssuer }}
spec:
  gatewayClassName: {{ $g.className }}
  listeners:
    # Only this namespace's routes: cert-manager's ACME solver and the redirect.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    {{- range $name, $host := $g.hostnames }}
    {{- if $host }}
    - name: https-{{ $name }}
      protocol: HTTPS
      port: 443
      hostname: {{ $host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: tls-{{ $name }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.namespaces.platform }}
    {{- end }}
    {{- end }}
---
# Everything on port 80 except ACME challenges goes to HTTPS (an exact-path
# match — cert-manager's solver route — wins over this one).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hbb.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $g.name }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
