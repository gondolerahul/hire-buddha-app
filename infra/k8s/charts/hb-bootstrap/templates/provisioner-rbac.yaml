{{- if .Values.provisionerRbac.enabled }}
# The provisioner's rights on the cluster (Phase 14 M2, tech spec §6.2
# namespace_ready): each tenant's namespace `t-<key>` with its quota, default
# limits and default-deny network policy — what provisioner.namespace_manifests
# applies (server-side apply: get, create, patch). Kubernetes RBAC cannot
# limit a ClusterRole to names starting `t-`; the provisioner only ever names
# `t-<key>`. Offboarding deletes a closed or test business's namespace (and so
# everything in it; docs/phase15/13 §6 step 6).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hb-provisioner
  labels:
    {{- include "hbb.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "resourcequotas", "limitranges"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hb-provisioner
  labels:
    {{- include "hbb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hb-provisioner
subjects:
  - kind: ServiceAccount
    name: sa-provisioner
    namespace: {{ .Values.namespaces.platform }}
{{- end }}
