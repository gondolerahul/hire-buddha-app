{{- range $id, $sa := .Values.serviceAccounts }}
---
# sa-{{ $id }}: the {{ $id }} service's pods sign in as its managed identity
# (workload identity; Azure setup guide §9.4 — the federated credential's
# subject is system:serviceaccount:{{ $.Values.namespaces.platform }}:sa-{{ $id }}).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-{{ $id }}
  namespace: {{ $.Values.namespaces.platform }}
  labels:
    {{- include "hbb.labels" $ | nindent 4 }}
  {{- with ($sa | default dict).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
