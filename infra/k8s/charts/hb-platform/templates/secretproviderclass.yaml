{{- if .Values.secrets.csi.enabled }}
{{- $csi := .Values.secrets.csi }}
{{- /* api, worker and migrations always; any further identity with a client id (the provisioner). */}}
{{- $identities := list "api" "worker" "migrations" }}
{{- range $name, $id := $csi.clientIds }}
{{- if and $id (not (has $name $identities)) }}{{ $identities = append $identities $name }}{{ end }}
{{- end }}
{{- range $identity := $identities }}
---
# Read as the {{ $identity }} workload's own managed identity: a pod's service
# account is federated to that identity only (Azure setup guide §9.4).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $.Release.Name }}-secrets-{{ $identity }}
  labels:
    {{- include "hb.labels" $ | nindent 4 }}
  annotations:
    # Created before the migration hook, which mounts it; recreated each release.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ required (printf "secrets.csi.clientIds.%s is required" $identity) (index $csi.clientIds $identity) | quote }}
    keyvaultName: {{ required "secrets.csi.keyVaultName is required" $csi.keyVaultName | quote }}
    tenantId: {{ required "secrets.csi.tenantId is required" $csi.tenantId | quote }}
    # Each secret becomes a file named after the setting it fills
    # (backend/src/common/config.py, _load_settings).
    objects: |
      array:
      {{- range $csi.objects }}
        - |
          objectName: {{ .name }}
          objectType: secret
          objectAlias: {{ .alias }}
      {{- end }}
{{- end }}
{{- end }}
