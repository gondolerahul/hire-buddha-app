{{- if .Values.gateway.enabled }}
{{- $h := .Values.gateway.hostnames }}
{{- if $h.app }}
# app.<domain>: the SPA; its nginx forwards /api and /stream to the API.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hb-app
  labels:
    {{- include "hb.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames: [{{ $h.app | quote }}]
  rules:
    - backendRefs:
        - name: hb-frontend
          port: 80
      {{- with .Values.gateway.hsts }}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: {{ . | quote }}
      {{- end }}
{{- end }}
{{- range $name, $host := (dict "api" $h.api "gateway" $h.gateway) }}
{{- if $host }}
---
# {{ $name }}.<domain>: the API itself — REST, webhooks, telephony media streams.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hb-{{ $name }}
  labels:
    {{- include "hb.labels" $ | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml $.Values.gateway.parentRefs | nindent 4 }}
  hostnames: [{{ $host | quote }}]
  rules:
    - backendRefs:
        - name: hb-api
          port: {{ $.Values.api.service.port }}
      # A call's media WebSocket lasts as long as the call (spike SP-7).
      timeouts:
        request: 0s
      {{- with $.Values.gateway.hsts }}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: {{ . | quote }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
