apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "hb.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{- if ne (toString $value) "" }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.tenantRuntime.enabled }}
  # The sandbox and checks images of this release (WS6): same registry and tag.
  SANDBOX_K8S_IMAGE: {{ include "hb.image" (dict "root" . "image" "sandbox") | quote }}
  CHECKS_IMAGE: {{ include "hb.image" (dict "root" . "image" "checks") | quote }}
  {{- end }}
