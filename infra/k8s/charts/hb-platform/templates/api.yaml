{{- if .Values.api.enabled }}
{{- $c := dict "root" $ "component" "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hb-api
  labels:
    {{- include "hb.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $c.component }}
spec:
  replicas: {{ .Values.api.replicas }}
  # One instance (HD12): the new pod is ready before the old one stops, and
  # the old one has the grace period to finish live calls.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      {{- include "hb.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hb.podLabels" $c | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.api.name }}
      {{- if .Values.tenantRuntime.enabled }}
      # It starts sandbox pods and TenantApps in t-* namespaces with its service account
      # (hb-bootstrap's hb-platform-tenant-runtime says what it may do).
      automountServiceAccountToken: true
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- include "hb.podSpecCommon" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "hb.image" (dict "root" $ "image" "api") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          {{- include "hb.backendEnv" . | nindent 10 }}
          {{- include "hb.databaseUrlEnv" (dict "root" $ "user" "api") | nindent 12 }}
            - name: FORWARDED_ALLOW_IPS
              value: {{ .Values.api.forwardedAllowIps | quote }}
          {{- include "hb.backendVolumeMounts" . | nindent 10 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          # /api/v1/health is always 200 (a broken feature or a dead worker is
          # reported in its body, not by pulling the API out of rotation).
          startupProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      {{- include "hb.backendVolumes" (dict "root" $ "identity" "api") | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: hb-api
  labels:
    {{- include "hb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "hb.selectorLabels" $c | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
{{- end }}
