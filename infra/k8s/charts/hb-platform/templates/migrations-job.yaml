{{- if .Values.migrations.enabled }}
{{- $c := dict "root" $ "component" "migrations" }}
# The migration runner (python -m src.common.tenancy.migrate all: the control
# database, then in split mode every tenant database) before the release's
# pods roll (Helm hook). A failed
# migration fails the release, and the old pods keep running.
apiVersion: batch/v1
kind: Job
metadata:
  name: hb-migrations-{{ .Release.Revision }}
  labels:
    {{- include "hb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "hb.podLabels" $c | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- /* A hook runs before the release's own objects exist: on Azure this is the
             bootstrap's sa-migrator account (workload identity, Key Vault); elsewhere "default". */}}
      serviceAccountName: {{ .Values.migrations.serviceAccountName | default "default" }}
      {{- include "hb.podSpecCommon" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "hb.image" (dict "root" $ "image" "api") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python", "-m", "src.common.tenancy.migrate", "all"]
          {{- include "hb.backendEnvInline" . | nindent 10 }}
          {{- include "hb.databaseUrlEnv" (dict "root" $ "user" "migrations") | nindent 12 }}
          {{- include "hb.backendVolumeMounts" . | nindent 10 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      {{- include "hb.backendVolumes" (dict "root" $ "identity" "migrations") | nindent 6 }}
{{- end }}
