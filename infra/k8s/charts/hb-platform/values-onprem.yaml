# hb-platform on a self-managed cluster (tech spec §19.5). A stub that keeps the
# templates honest: rendered in CI, its output must carry no Azure annotation
# (P-08, §19.7). The on-premise adapters (s3, vault) are built when needed.

config:
  PLATFORM_PROFILE: onprem

serviceAccountsCreate: true

secrets:
  # Settings from a Kubernetes Secret (synced from Vault by the operator of choice).
  existingSecret: hb-platform-env
  csi:
    enabled: false

gateway:
  enabled: true
  parentRefs:
    - name: platform-gateway
      namespace: hb-system
