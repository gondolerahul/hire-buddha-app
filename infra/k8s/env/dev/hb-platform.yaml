# Azure dev (Phase 14 WS0 slice 1). Layered over values.yaml + values-azure.yaml.
# Replace every <...> with the values recorded in infra/azure/env/dev.env when the
# environment is created (guide §2); none of them is a secret.

global:
  env: dev
  imageRegistry: acrhbdevac48.azurecr.io
  imagePullPolicy: Always

config:
  STORAGE_BACKEND: azure_blob
  AZURE_STORAGE_ACCOUNT_URL: https://sthbdevac48.blob.core.windows.net/
  AZURE_KEYVAULT_URL: https://kv-hb-dev-ac48.vault.azure.net/
  ANTHROPIC_PROVIDER: vertex
  STREAMING_HOST: gateway.azdev.hirebuddha.com
  STREAMING_PROTOCOL: wss
  FRONTEND_URL: https://app.azdev.hirebuddha.com
  CORS_ORIGINS: https://app.azdev.hirebuddha.com
  # Traces to the collector hb-bootstrap installs (WS1 1.9), which forwards them to App Insights.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://hb-otel-collector.hb-platform.svc.cluster.local:4317
  # The tenant runtime is off below: no Kubernetes sandbox yet, so the sandbox tools
  # refuse and the idle reaper skips (with `kubernetes` it failed every 5 minutes).
  SANDBOX_RUNTIME: ""
  # M2 — tenant provisioning (Bicep slice 2): its own worker and identity, the
  # pool server's roles, each tenant's identity and KEK. Dev itself stays in
  # single mode; tenants are provisioned on psql-hb-dev-pool-01.
  PROVISIONING_QUEUE: provisioning
  TENANT_DB_DDL_ROLE: hb_migrator
  TENANT_DB_RUNTIME_PRINCIPALS: id-hb-dev-api,id-hb-dev-worker,id-hb-dev-connsvc
  TENANT_DB_MIGRATOR_PRINCIPAL: id-hb-dev-migrator
  AZURE_SUBSCRIPTION_ID: af133a07-d04f-4d5d-928b-d532a3abf0f4
  AZURE_LOCATION: centralindia
  TENANT_IDENTITY_RESOURCE_GROUP: rg-hb-dev-tenants
  TENANT_IDENTITY_NAME_PREFIX: id-hb-dev-t-
  AKS_OIDC_ISSUER: https://centralindia.oic.prod-aks.azure.com/7cb9c9f3-27c0-412e-805c-fac9974e9cdc/88dd69ed-eaa3-421c-9949-0c4bc57062fc/
  DATA_API_MODE: in_process
  KEK_BACKEND: azure_keyvault
  AZURE_TENANT_KEYS_VAULT_URL: https://kv-hb-dev-tk-ac48.vault.azure.net/

database:
  url: postgresql+asyncpg://{user}@psql-hb-dev-control.postgres.database.azure.com:5432/hb_control?ssl=require
  users:
    api: id-hb-dev-api
    worker: id-hb-dev-worker
    migrations: id-hb-dev-migrator
    provisioner: id-hb-dev-provisioner

secrets:
  csi:
    keyVaultName: kv-hb-dev-ac48
    tenantId: 7cb9c9f3-27c0-412e-805c-fac9974e9cdc
    clientIds:                              # az identity show -n id-hb-dev-<id> --query clientId
      api: fe5fa098-6452-43d9-90df-f585cb5e5b57
      worker: 215f6ffc-398d-4803-9a10-2e7a7e9af822
      migrations: 4aeae4d6-29cd-4024-ae73-2a37cb43ecf4
      provisioner: 3c25dc64-6183-4bdf-a065-3984b8ea5544

googleFederation:
  # Pool hb-azure-dev / provider aks-dev in hirebuddha-production (guide §14):
  # only sa-api and sa-worker of hb-platform may act as hb-vertex-dev.
  enabled: true
  audience: //iam.googleapis.com/projects/844891213866/locations/global/workloadIdentityPools/hb-azure-dev/providers/aks-dev
  serviceAccountEmail: hb-vertex-dev@hirebuddha-production.iam.gserviceaccount.com

gateway:
  hostnames:
    app: app.azdev.hirebuddha.com
    gateway: gateway.azdev.hirebuddha.com

# Off until its images (hb-egress-proxy, caddy-redis) are in the registry and its
# secrets (tenant-edge-redis, egress-proxy, gitea) and Gitea's database login exist.
tenantRuntime:
  enabled: false

# Dev sizing (20 Oct, budget): reservations close to what dev uses, so the
# platform pool stays at one node (requests had reached 93% of a D4s_v5's CPU
# while it used 4%). Memory limits stay the chart's. `workers` is a list:
# Helm replaces it whole, so all three are restated.
api:
  resources:
    requests: { cpu: 150m, memory: 768Mi }
    limits: { memory: 3Gi }

workers:
  - name: worker
    image: worker
    metricsPort: 9101
    metricsPortSetting: WORKER_METRICS_PORT
    queue: "arq:queue"
    replicas: 1
    terminationGracePeriodSeconds: 600
    resources:
      requests: { cpu: 150m, memory: 768Mi }
      limits: { memory: 4Gi }
    autoscaling: { enabled: false, minReplicas: 1, maxReplicas: 4, dueJobs: "10" }
  - name: child-worker
    image: childWorker
    metricsPort: 9102
    metricsPortSetting: CHILD_WORKER_METRICS_PORT
    queue: "children"
    replicas: 1
    terminationGracePeriodSeconds: 600
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 4Gi }
    autoscaling: { enabled: false, minReplicas: 1, maxReplicas: 6, dueJobs: "10" }
  - name: event-worker
    image: eventWorker
    metricsPort: 9103
    metricsPortSetting: EVENT_WORKER_METRICS_PORT
    queue: "events"
    replicas: 1
    terminationGracePeriodSeconds: 120
    resources:
      requests: { cpu: 50m, memory: 384Mi }
      limits: { memory: 1Gi }
    autoscaling: { enabled: false, minReplicas: 1, maxReplicas: 4, dueJobs: "50" }
  # M2: tenant provisioning as the provisioner identity (sa-provisioner).
  - name: provisioner
    image: worker
    identity: provisioner
    command: ["python", "-m", "arq", "src.ai.worker.ProvisionerWorkerSettings"]
    kubernetesApi: true
    metricsPort: 9105
    metricsPortSetting: PROVISIONER_METRICS_PORT
    queue: "provisioning"
    replicas: 1
    terminationGracePeriodSeconds: 600
    resources:
      requests: { cpu: 50m, memory: 384Mi }
      limits: { memory: 1Gi }
    autoscaling: { enabled: false, minReplicas: 1, maxReplicas: 1, dueJobs: "10" }

scheduler:
  replicas: 1

frontend:
  replicas: 1
