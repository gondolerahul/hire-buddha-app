# Azure dev bootstrap. Layered over values.yaml + values-azure.yaml; install.sh
# adds the client ids and the vault name from infra/azure/env/dev.env.

env: dev

gateway:
  # The gateway's LoadBalancer takes the static IP Bicep created (guide §4, §9.5).
  serviceAnnotations:
    service.beta.kubernetes.io/azure-load-balancer-resource-group: rg-hb-dev-core
    service.beta.kubernetes.io/azure-pip-name: pip-hb-dev-ingress
  hostnames:
    app: app.azdev.hirebuddha.com
    api: api.azdev.hirebuddha.com
    gateway: gateway.azdev.hirebuddha.com
    connect: connect.azdev.hirebuddha.com

certManager:
  issuer:
    # email: from HB_ACME_EMAIL (install.sh) — Let's Encrypt's expiry notices go there.
    # Staging until a dev certificate has been seen to work, then:
    # server: https://acme-v02.api.letsencrypt.org/directory
    server: https://acme-staging-v02.api.letsencrypt.org/directory
