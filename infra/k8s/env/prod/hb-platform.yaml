# Azure production (decision D49: the same size as dev). Layered over values.yaml +
# values-azure.yaml. Ids from infra/azure/env/prod.env (21 Oct 2026); none is a secret.
# The deploy workflow promotes dev's images here after approval (D51).

global:
  env: prod
  imageRegistry: acrhbprode7b3.azurecr.io
  imagePullPolicy: Always

config:
  STORAGE_BACKEND: azure_blob
  AZURE_STORAGE_ACCOUNT_URL: https://sthbprode7b3.blob.core.windows.net/
  AZURE_KEYVAULT_URL: https://kv-hb-prod-e7b3.vault.azure.net/
  ANTHROPIC_PROVIDER: vertex
  STREAMING_HOST: gateway.azprod.hirebuddha.com
  STREAMING_PROTOCOL: wss
  FRONTEND_URL: https://app.azprod.hirebuddha.com
  CORS_ORIGINS: https://app.azprod.hirebuddha.com
  # Traces to the collector hb-bootstrap installs (WS1 1.9), which forwards them to App Insights.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://hb-otel-collector.hb-platform.svc.cluster.local:4317
  # The tenant runtime is off below: no Kubernetes sandbox yet, so the sandbox tools
  # refuse and the idle reaper skips (with `kubernetes` it failed every 5 minutes).
  SANDBOX_RUNTIME: ""
  # M2 — tenant provisioning (Bicep slice 2): its own worker and identity, the
  # pool server's roles, each tenant's identity and KEK.
  # M2-3 (20 Oct): every business in its own database on psql-hb-prod-pool-01
  # (the platform company moved there with the split tool).
  TENANCY_MODE: split
  PROVISIONING_QUEUE: provisioning
  TENANT_DB_DDL_ROLE: hb_migrator
  TENANT_DB_RUNTIME_PRINCIPALS: id-hb-prod-api,id-hb-prod-worker,id-hb-prod-connsvc
  TENANT_DB_MIGRATOR_PRINCIPAL: id-hb-prod-migrator
  AZURE_SUBSCRIPTION_ID: af133a07-d04f-4d5d-928b-d532a3abf0f4
  AZURE_LOCATION: centralindia
  TENANT_IDENTITY_RESOURCE_GROUP: rg-hb-prod-tenants
  TENANT_IDENTITY_NAME_PREFIX: id-hb-prod-t-
  AKS_OIDC_ISSUER: https://centralindia.oic.prod-aks.azure.com/7cb9c9f3-27c0-412e-805c-fac9974e9cdc/754e6391-10da-496e-8df0-2dd84a23a936/
  DATA_API_MODE: in_process
  KEK_BACKEND: azure_keyvault
  AZURE_TENANT_KEYS_VAULT_URL: https://kv-hb-prod-tk-e7b3.vault.azure.net/

database:
  url: postgresql+asyncpg://{user}@psql-hb-prod-control.postgres.database.azure.com:5432/hb_control?ssl=require
  users:
    api: id-hb-prod-api
    worker: id-hb-prod-worker
    migrations: id-hb-prod-migrator
    provisioner: id-hb-prod-provisioner

secrets:
  csi:
    keyVaultName: kv-hb-prod-e7b3
    tenantId: 7cb9c9f3-27c0-412e-805c-fac9974e9cdc
    clientIds:                              # az identity show -n id-hb-prod-<id> --query clientId
      api: 34160366-3caf-4c52-9a72-03da778dd4bc
      worker: 4bce55de-0922-41c7-b753-1d5e78411fcc
      migrations: 39ea108a-dd59-474b-9ecd-566c8856c414
      provisioner: af71404a-6d58-46ac-b70a-4d08ed18ad42

googleFederation:
  # Pool hb-azure-prod / provider aks-prod in hirebuddha-production (guide §14,
  # created for production's cluster issuer): only sa-api and sa-worker may act
  # as hb-vertex-prod.
  enabled: true
  audience: //iam.googleapis.com/projects/844891213866/locations/global/workloadIdentityPools/hb-azure-prod/providers/aks-prod
  serviceAccountEmail: hb-vertex-prod@hirebuddha-production.iam.gserviceaccount.com

gateway:
  hostnames:
    app: app.azprod.hirebuddha.com
    gateway: gateway.azprod.hirebuddha.com

# Off until its images (hb-egress-proxy, caddy-redis) are in the registry and its
# secrets (tenant-edge-redis, egress-proxy, gitea) and Gitea's database login exist.
tenantRuntime:
  enabled: false

# D49: dev's requests and replicas (one D4s_v5 platform node). Raise them with
# real load. `workers` is a list: Helm replaces it whole, so all are restated.
api:
  resources:
    requests: { cpu: 150m, memory: 768Mi }
    limits: { memory: 3Gi }

workers:
  - name: worker
    image: worker
    metricsPort: 9101
    metricsPortSetting: WORKER_METRICS_PORT
    queue: "arq:queue"
    replicas: 1
    terminationGracePeriodSeconds: 600
    resources:
      requests: { cpu: 150m, memory: 768Mi }
      limits: { memory: 4Gi }
    autoscaling: { enabled: false, minReplicas: 1, maxReplicas: 4, dueJobs: "10" }
  - name: child-worker
    image: childWorker
    metricsPort: 9102
    metricsPortSetting: CHILD_WORKER_METRICS_PORT
    queue: "children"
    replicas: 1
    terminationGracePeriodSeconds: 600
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 4Gi }
    autoscaling: { enabled: false, minReplicas: 1, maxReplicas: 6, dueJobs: "10" }
  - name: event-worker
    image: eventWorker
    metricsPort: 9103
    metricsPortSetting: EVENT_WORKER_METRICS_PORT
    queue: "events"
    replicas: 1
    terminationGracePeriodSeconds: 120
    resources:
      requests: { cpu: 50m, memory: 384Mi }
      limits: { memory: 1Gi }
    autoscaling: { enabled: false, minReplicas: 1, maxReplicas: 4, dueJobs: "50" }
  # M2: tenant provisioning as the provisioner identity (sa-provisioner).
  - name: provisioner
    image: worker
    identity: provisioner
    command: ["python", "-m", "arq", "src.ai.worker.ProvisionerWorkerSettings"]
    kubernetesApi: true
    metricsPort: 9105
    metricsPortSetting: PROVISIONER_METRICS_PORT
    queue: "provisioning"
    replicas: 1
    terminationGracePeriodSeconds: 600
    resources:
      requests: { cpu: 50m, memory: 384Mi }
      limits: { memory: 1Gi }
    autoscaling: { enabled: false, minReplicas: 1, maxReplicas: 1, dueJobs: "10" }

scheduler:
  replicas: 1

frontend:
  replicas: 1
