<!DOCTYPE html>
<!-- @dsCard group="Type" name="Mono — JetBrains Mono" subtitle="Agent logs, labels, metrics — the lab texture" viewport="700x195" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);padding:26px 28px;}
  .cap{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;display:flex;justify-content:space-between;}
  .cap span{color:var(--fg-subtle);}
  .eyebrow{font-family:var(--font-mono);font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;}
  .log{font-family:var(--font-mono);font-size:13px;line-height:1.9;color:var(--fg-muted);}
  .log .t{color:var(--fg-subtle);}
  .log .ok{color:var(--positive);}
  .log .g{color:var(--gold-300);}
</style></head>
<body>
  <div class="cap">Mono — JetBrains Mono <span>logs · labels · metrics</span></div>
  <div class="eyebrow">// RESEARCH · AGENTS · v2</div>
  <div class="log">
    <div><span class="t">09:42:01</span> agent.ops <span class="ok">✓ completed</span> 14 tasks</div>
    <div><span class="t">09:42:03</span> model <span class="g">buddha-frontier-1</span> · 2 awaiting review</div>
    <div><span class="t">09:42:08</span> tool <span class="g">stripe.invoices.create</span> → ok</div>
  </div>
</body></html>
