<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Gold scale" subtitle="Polished metallic gold + tonal scale — the luxe accent" viewport="700x285" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);padding:24px 28px;}
  .cap{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;}
  .top{display:flex;gap:18px;align-items:stretch;margin-bottom:18px;}

  /* Polished gold plate */
  .plate{flex:1;position:relative;border-radius:var(--r-lg);overflow:hidden;
    background:var(--gradient-gold-metallic);
    box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.65), inset 0 -2px 6px rgba(90,55,10,.55);
    display:flex;align-items:center;padding:0 26px;min-height:118px;}
  .plate .gleam{position:absolute;inset:0;background:var(--gradient-gold-shine);background-size:250% 100%;
    animation:sweep 5.5s var(--ease-in-out) infinite;mix-blend-mode:screen;}
  @keyframes sweep{0%{background-position:160% 0}55%,100%{background-position:-60% 0}}
  .plate .txt{position:relative;}
  .plate .lux{font-family:var(--font-logo);font-size:34px;color:#3a2407;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.45);letter-spacing:.01em;}
  .plate .sub{font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#5a3a12;margin-top:8px;}

  /* Conic medallion */
  .coin{width:118px;height:118px;border-radius:50%;flex:none;position:relative;
    background:var(--gradient-gold-conic);
    box-shadow:0 8px 24px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,244,210,.5), inset 0 2px 8px rgba(255,255,255,.4);
    display:flex;align-items:center;justify-content:center;}
  .coin::after{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--gradient-gold-metallic);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -3px 6px rgba(90,55,10,.5);}
  .coin img{position:relative;height:60px;z-index:1;filter:drop-shadow(0 1px 0 rgba(255,255,255,.4));}

  /* Tonal scale */
  .scale{display:flex;gap:6px;}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px;}
  .chip{height:34px;border-radius:var(--r-xs);border:1px solid rgba(255,255,255,.06);}
  .n{font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle);text-align:center;}
</style></head>
<body>
  <div class="cap">Gold · polished · metallic · luxe</div>
  <div class="top">
    <div class="plate"><div class="gleam"></div><div class="txt"><div class="lux">24K BUDDHA</div><div class="sub">--gradient-gold-metallic</div></div></div>
    <div class="coin"><img src="../assets/logo-mark-black.svg"></div>
  </div>
  <div class="scale">
    <div class="sw"><div class="chip" style="background:var(--gold-100)"></div><div class="n">100</div></div>
    <div class="sw"><div class="chip" style="background:var(--gold-200)"></div><div class="n">200</div></div>
    <div class="sw"><div class="chip" style="background:var(--gold-300)"></div><div class="n">300</div></div>
    <div class="sw"><div class="chip" style="background:var(--gold-400)"></div><div class="n">400</div></div>
    <div class="sw"><div class="chip" style="background:var(--gold-500);box-shadow:0 0 0 2px var(--accent)"></div><div class="n">500★</div></div>
    <div class="sw"><div class="chip" style="background:var(--gold-600)"></div><div class="n">600</div></div>
    <div class="sw"><div class="chip" style="background:var(--gold-700)"></div><div class="n">700</div></div>
    <div class="sw"><div class="chip" style="background:var(--gold-800)"></div><div class="n">800</div></div>
    <div class="sw"><div class="chip" style="background:var(--gold-900)"></div><div class="n">900</div></div>
  </div>
</body></html>
