<!DOCTYPE html>
<!-- @dsCard group="Type" name="Display — Space Grotesk" subtitle="Headlines, hero, big numbers" viewport="700x270" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);padding:26px 28px;}
  .cap{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;display:flex;justify-content:space-between;}
  .cap span{color:var(--fg-subtle);}
  .spec{font-family:var(--font-display);font-weight:700;font-size:84px;line-height:0.96;letter-spacing:-0.03em;color:var(--fg);margin:0;}
  .sub{font-family:var(--font-display);font-weight:600;font-size:30px;color:var(--fg-muted);margin-top:18px;letter-spacing:-0.02em;}
</style></head>
<body>
  <div class="cap">Secondary display — Space Grotesk <span>700 / 600 · mixed case</span></div>
  <p class="spec">Towards digital<br>enlightenment</p>
  <div class="sub">Hire minds, not headcount.</div>
</body></html>
