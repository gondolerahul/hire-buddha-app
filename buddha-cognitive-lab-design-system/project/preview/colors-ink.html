<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Ink scale" subtitle="Warm near-blacks & warm grays" viewport="700x195" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);padding:26px 28px;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;display:flex;flex-direction:column;gap:7px;}
  .chip{height:64px;border-radius:var(--r-sm);border:1px solid var(--border);}
  .n{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);}
  .h{font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle);}
  .cap{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;}
</style></head>
<body>
  <div class="cap">Ink · warm near-blacks &amp; warm grays</div>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--ink-950)"></div><div class="n">950</div><div class="h">canvas</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="n">900</div><div class="h">surface</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-800)"></div><div class="n">800</div><div class="h">raised</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="n">700</div><div class="h">border</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="n">500</div><div class="h">&nbsp;</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-400)"></div><div class="n">400</div><div class="h">muted</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-200)"></div><div class="n">200</div><div class="h">&nbsp;</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-50)"></div><div class="n">50</div><div class="h">paper</div></div>
    <div class="sw"><div class="chip" style="background:var(--white)"></div><div class="n">white</div><div class="h">#fffdf9</div></div>
  </div>
</body></html>
