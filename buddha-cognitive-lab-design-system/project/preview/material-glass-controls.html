<!DOCTYPE html>
<!-- @dsCard group="Material" name="Glass controls" subtitle="Translucent buttons, segmented control & toggle on the lens edge" viewport="700x210" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);padding:0;overflow:hidden;}
  .stage{position:relative;height:210px;overflow:hidden;}
  .bd .glow{position:absolute;width:460px;height:460px;left:50%;top:-180px;transform:translateX(-50%);background:var(--glow-gold);}
  .bd .g2{position:absolute;width:300px;height:300px;right:-30px;bottom:-150px;background:radial-gradient(circle,rgba(237,171,72,.45),transparent 65%);}
  .bd .mark{position:absolute;left:-30px;bottom:-40px;height:220px;opacity:.35;}
  .cap{position:absolute;top:16px;left:24px;z-index:5;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);}
  .layer{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:34px 28px 0;}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}

  .glass-blur{-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);}
  /* buttons */
  .btn{font-family:var(--font-body);font-weight:600;font-size:13.5px;border-radius:var(--r-pill);padding:11px 20px;
    border:1px solid var(--glass-border);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;}
  .g{background:var(--glass-tint-light);color:var(--fg);box-shadow:var(--glass-edge);}
  .gg{background:var(--glass-tint);color:var(--gold-200);box-shadow:var(--glass-edge-gold);}
  .gg .d{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}

  /* segmented */
  .seg{display:inline-flex;padding:4px;border-radius:var(--r-pill);background:var(--glass-tint-strong);
    border:1px solid var(--glass-border);box-shadow:var(--glass-edge);}
  .seg button{font-family:var(--font-body);font-size:12.5px;font-weight:600;color:var(--fg-muted);background:transparent;
    border:0;border-radius:var(--r-pill);padding:7px 15px;cursor:pointer;}
  .seg button.on{background:var(--glass-tint-gold);color:var(--gold-200);box-shadow:inset 0 1px 0 rgba(255,240,210,.5);}

  /* toggle */
  .tg{width:50px;height:28px;border-radius:99px;background:var(--accent);position:relative;
    box-shadow:var(--glass-edge),0 0 14px -2px var(--accent);border:1px solid var(--border-gold);}
  .tg::after{content:"";position:absolute;top:3px;left:25px;width:20px;height:20px;border-radius:50%;
    background:linear-gradient(180deg,#fffdf9,#f1ece2);box-shadow:0 2px 4px rgba(0,0,0,.4);}
  .tglab{font-size:13px;color:var(--fg-muted);}

  .note{position:absolute;bottom:12px;left:24px;z-index:5;font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle);}
</style></head>
<body>
  <div class="stage">
    <div class="bd"><div class="glow"></div><div class="g2"></div><img class="mark" src="../assets/logo-mark-gold.svg"></div>
    <div class="cap">Glass controls</div>
    <div class="layer">
      <div class="row">
        <button class="btn g glass-blur">Configure</button>
        <button class="btn gg glass-blur"><span class="d"></span>Hire a Buddha</button>
        <div class="seg glass-blur"><button class="on">All</button><button>Active</button><button>Attention</button></div>
      </div>
      <div class="row">
        <span class="tg glass-blur"></span><span class="tglab">Autonomy enabled</span>
        <span style="margin-left:18px" class="btn g glass-blur">⌘K&nbsp;&nbsp;Search</span>
      </div>
    </div>
    <div class="note">.btn-glass · .glass-bar · segmented + toggle on the lens edge</div>
  </div>
</body></html>
