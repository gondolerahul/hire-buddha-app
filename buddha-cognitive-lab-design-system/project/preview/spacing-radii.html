<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="Soft, not bubbly · pill reserved for CTAs & tags" viewport="700x185" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);padding:26px 28px;}
  .cap{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:18px;}
  .row{display:flex;gap:14px;align-items:flex-end;}
  .it{display:flex;flex-direction:column;gap:8px;align-items:center;}
  .box{width:72px;height:72px;background:var(--surface-3);border:1px solid var(--border-gold);}
  .n{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);}
  .v{font-family:var(--font-mono);font-size:10px;color:var(--fg-faint);}
</style></head>
<body>
  <div class="cap">Corner radii</div>
  <div class="row">
    <div class="it"><div class="box" style="border-radius:var(--r-xs)"></div><div class="n">xs</div><div class="v">4</div></div>
    <div class="it"><div class="box" style="border-radius:var(--r-sm)"></div><div class="n">sm</div><div class="v">8</div></div>
    <div class="it"><div class="box" style="border-radius:var(--r-md)"></div><div class="n">md</div><div class="v">12</div></div>
    <div class="it"><div class="box" style="border-radius:var(--r-lg)"></div><div class="n">lg</div><div class="v">18</div></div>
    <div class="it"><div class="box" style="border-radius:var(--r-xl)"></div><div class="n">xl</div><div class="v">26</div></div>
    <div class="it"><div class="box" style="border-radius:var(--r-2xl)"></div><div class="n">2xl</div><div class="v">36</div></div>
    <div class="it"><div class="box" style="border-radius:var(--r-pill)"></div><div class="n">pill</div><div class="v">∞</div></div>
  </div>
</body></html>
