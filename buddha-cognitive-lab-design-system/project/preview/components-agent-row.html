<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buddha employee row" subtitle="Signature product component" viewport="700x195" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);padding:24px 28px;}
  .cap{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;}
  .row{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;}
  .row.sel{border-color:var(--border-gold);background:var(--accent-quiet);}
  .av{width:40px;height:40px;border-radius:50%;background:var(--ink-800);border:1px solid var(--border-gold);display:flex;align-items:center;justify-content:center;flex:none;}
  .av img{height:24px;}
  .meta{flex:1;min-width:0;}
  .nm{font-weight:600;font-size:15px;}
  .sub{font-family:var(--font-mono);font-size:11px;color:var(--fg-subtle);margin-top:2px;}
  .stat{font-family:var(--font-mono);font-size:11px;color:var(--gold-300);display:flex;align-items:center;gap:6px;}
  .d{width:6px;height:6px;border-radius:50%;background:var(--gold-400);}
  .num{font-family:var(--font-display);font-weight:500;font-size:18px;}
</style></head>
<body>
  <div class="cap">Buddha · employee row</div>
  <div class="row sel">
    <div class="av"><img src="../assets/logo-mark-gold.svg"></div>
    <div class="meta"><div class="nm">Operations Buddha</div><div class="sub">stripe · quickbooks · gmail</div></div>
    <div class="stat"><span class="d"></span>running</div>
    <div class="num">142</div>
  </div>
  <div class="row">
    <div class="av"><img src="../assets/logo-mark-white.svg" style="opacity:.7"></div>
    <div class="meta"><div class="nm">Support Buddha</div><div class="sub">zendesk · slack</div></div>
    <div class="stat" style="color:var(--positive)"><span class="d" style="background:var(--positive)"></span>idle</div>
    <div class="num">38</div>
  </div>
</body></html>
