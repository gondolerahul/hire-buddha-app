<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="8px base" viewport="700x320" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);padding:26px 28px;}
  .cap{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:18px;}
  .r{display:flex;align-items:center;gap:14px;margin-bottom:9px;}
  .bar{height:14px;background:var(--gradient-gold);border-radius:3px;}
  .n{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);width:38px;flex:none;}
  .v{font-family:var(--font-mono);font-size:10px;color:var(--fg-faint);}
</style></head>
<body>
  <div class="cap">Spacing · 8px base</div>
  <div class="r"><span class="n">1</span><div class="bar" style="width:4px"></div><span class="v">4</span></div>
  <div class="r"><span class="n">2</span><div class="bar" style="width:8px"></div><span class="v">8</span></div>
  <div class="r"><span class="n">3</span><div class="bar" style="width:12px"></div><span class="v">12</span></div>
  <div class="r"><span class="n">4</span><div class="bar" style="width:16px"></div><span class="v">16</span></div>
  <div class="r"><span class="n">5</span><div class="bar" style="width:24px"></div><span class="v">24</span></div>
  <div class="r"><span class="n">6</span><div class="bar" style="width:32px"></div><span class="v">32</span></div>
  <div class="r"><span class="n">7</span><div class="bar" style="width:48px"></div><span class="v">48</span></div>
  <div class="r"><span class="n">8</span><div class="bar" style="width:64px"></div><span class="v">64</span></div>
  <div class="r"><span class="n">9</span><div class="bar" style="width:96px"></div><span class="v">96 · section</span></div>
</body></html>
