<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type scale" subtitle="1.250 major third" viewport="700x290" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);padding:24px 28px;}
  .cap{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;}
  .r{display:flex;align-items:baseline;gap:18px;padding:5px 0;border-bottom:1px solid var(--border);}
  .r:last-child{border:0;}
  .tag{font-family:var(--font-mono);font-size:11px;color:var(--fg-subtle);width:70px;flex:none;}
  .ex{font-family:var(--font-display);font-weight:500;color:var(--fg);letter-spacing:-.02em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .px{font-family:var(--font-mono);font-size:10px;color:var(--fg-faint);margin-left:auto;flex:none;}
</style></head>
<body>
  <div class="cap">Type scale · 1.250</div>
  <div class="r"><span class="tag">5xl</span><span class="ex" style="font-size:40px">Enlightenment</span><span class="px">88</span></div>
  <div class="r"><span class="tag">3xl</span><span class="ex" style="font-size:30px">Hire minds</span><span class="px">48</span></div>
  <div class="r"><span class="tag">2xl</span><span class="ex" style="font-size:24px">Your workforce</span><span class="px">36</span></div>
  <div class="r"><span class="tag">xl</span><span class="ex" style="font-size:20px">Design a Buddha</span><span class="px">28</span></div>
  <div class="r"><span class="tag">lg</span><span class="ex" style="font-size:17px">Section heading</span><span class="px">22</span></div>
  <div class="r"><span class="tag">base</span><span class="ex" style="font-size:15px;font-family:var(--font-body);font-weight:400">Body text · 16</span><span class="px">16</span></div>
</body></html>
