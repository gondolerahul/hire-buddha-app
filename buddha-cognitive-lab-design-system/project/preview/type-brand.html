<!DOCTYPE html>
<!-- @dsCard group="Type" name="Brand display — Roblox Font" subtitle="The real wordmark face (self-hosted) — logo & hero statements" viewport="700x300" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);padding:26px 28px;position:relative;overflow:hidden;}
  .glow{position:absolute;width:360px;height:360px;right:-60px;top:-80px;background:var(--glow-gold);}
  .cap{position:relative;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:18px;display:flex;justify-content:space-between;}
  .cap span{color:var(--fg-subtle);}
  .bold{position:relative;font-family:var(--font-logo);font-weight:700;font-size:60px;line-height:0.98;color:var(--fg);margin:0;}
  .outline{position:relative;font-family:'Roblox Outline';font-size:64px;line-height:1.04;margin:14px 0 0;color:var(--gold-300);}
  .tags{position:relative;display:flex;gap:10px;margin-top:22px;}
  .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;color:var(--fg-muted);background:var(--surface-3);border:1px solid var(--border);border-radius:var(--r-pill);padding:5px 12px;}
  .tag b{color:var(--gold-300);font-weight:500;}
</style></head>
<body>
  <div class="glow"></div>
  <div class="cap">Brand display — Roblox Font <span>self-hosted · the wordmark voice</span></div>
  <p class="bold">HIRE MINDS,<br>NOT HEADCOUNT</p>
  <p class="outline">ENLIGHTENMENT</p>
  <div class="tags">
    <span class="tag"><b>Bold 700</b> · headlines</span>
    <span class="tag"><b>Outline</b> · poster cut</span>
  </div>
</body></html>
