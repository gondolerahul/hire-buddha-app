version: '3.8'

services:
  # ── API (Port 8000) — every endpoint: REST, webhooks, internal events, ────
  #    and the audio / video / telephony WebSockets.
  app:
    build:
      context: .
      target: dev   # backend/Dockerfile: api | worker | child-worker | scheduler | dev
    container_name: hirebuddha-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # Tenant sandbox workspaces (TL-16): durable, and at the same path on the
      # host, because the tenant containers the API starts are siblings on the
      # host's Docker daemon and mount this directory by path. (Starting them
      # also needs the daemon's socket and the docker CLI in the image.)
      - /var/lib/hirebuddha/sandbox:/var/lib/hirebuddha/sandbox
    environment:
      - SANDBOX_WORKSPACE_ROOT=/var/lib/hirebuddha/sandbox
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/hirebuddha
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=dev_secret_key_change_in_production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - RATE_LIMIT=200/minute
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-}    # empty disables POST /internal/event
      - STREAMING_HOST=gateway.hirebuddha.com     # public hostname telephony reaches this API on
      - STREAMING_PROTOCOL=wss
      - VIDEO_STREAMING_ENABLED=true
      - STUN_SERVERS=stun:stun.l.google.com:19302
    depends_on:
      - db
      - redis

  # PostgreSQL 16, as on Azure Flexible Server (Phase 14 TD-12, WS1 1.11). A
  # pg15 data directory does not open in 16, so this is a new volume
  # (postgres16_data); the old postgres_data volume is left as it was — dump it
  # with pg15 first if it holds data you need.
  db:
    image: pgvector/pgvector:pg16
    container_name: hirebuddha-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hirebuddha
    volumes:
      - postgres16_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hirebuddha-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Azure Blob Storage emulator, for the azure_blob storage adapter (Phase 14
  # WS1 1.2): STORAGE_BACKEND=azure_blob with
  # AZURE_STORAGE_CONNECTION_STRING=UseDevelopmentStorage=true. Optional —
  # `docker compose up -d azurite`; tests/integration/test_storage_azurite.py.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    container_name: hirebuddha-azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck --loose
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data
    profiles: ["azure"]

volumes:
  postgres_data:     # PostgreSQL 15 data from before Phase 14; no longer mounted
  postgres16_data:
  redis_data:
  azurite_data:
