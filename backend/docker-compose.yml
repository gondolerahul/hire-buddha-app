version: '3.8'

services:
  # ── Unified AI Gateway (Port 8001 — user-facing) ──────────────────────────
  # Replaces the old thin proxy gateway.
  # Handles: REST proxy, Webhooks, Internal Events, Audio WebSocket, Video WebRTC
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.gateway.app:app --host 0.0.0.0 --port 8001
    container_name: hirebuddha-unified-gateway
    ports:
      - "8001:8001"
    environment:
      - BACKEND_URL=http://app:8000
      - REDIS_URL=redis://redis:6379
      - RATE_LIMIT=200/minute
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/hirebuddha
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-change-me-in-production}
      - JWT_SECRET=${SECRET_KEY:-change-me-in-production}
      - STREAMING_HOST=gateway.hirebuddha.com     # public hostname for WS URL generation
      - STREAMING_PROTOCOL=wss
      - VIDEO_STREAMING_ENABLED=true
      - STUN_SERVERS=stun:stun.l.google.com:19302
    depends_on:
      - app
      - redis

  # ── Main FastAPI Backend (Port 8000 — internal) ───────────────────────────
  app:
    build: .
    container_name: hirebuddha-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/hirebuddha
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=dev_secret_key_change_in_production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    depends_on:
      - db
      - redis

  db:
    image: pgvector/pgvector:pg15
    container_name: hirebuddha-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hirebuddha
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hirebuddha-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
