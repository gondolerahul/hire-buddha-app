version: '3.8'

services:
  # ── API (Port 8000) — every endpoint: REST, webhooks, internal events, ────
  #    and the audio / video / telephony WebSockets.
  app:
    build: .
    container_name: hirebuddha-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/hirebuddha
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=dev_secret_key_change_in_production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - RATE_LIMIT=200/minute
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-}    # empty disables POST /internal/event
      - STREAMING_HOST=gateway.hirebuddha.com     # public hostname telephony reaches this API on
      - STREAMING_PROTOCOL=wss
      - VIDEO_STREAMING_ENABLED=true
      - STUN_SERVERS=stun:stun.l.google.com:19302
    depends_on:
      - db
      - redis

  db:
    image: pgvector/pgvector:pg15
    container_name: hirebuddha-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hirebuddha
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hirebuddha-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
