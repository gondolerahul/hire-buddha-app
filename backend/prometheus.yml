global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'hirebuddha-backend'
    static_configs:
      - targets: ['host.docker.internal:8000']

  # The arq workers' own /metrics (IN-20): jobs, durations, failures, backlog.
  # They bind WORKER_METRICS_ADDR (127.0.0.1 by default); a Prometheus in a
  # container needs an address it can reach — set it, behind the firewall.
  - job_name: 'hirebuddha-worker'
    static_configs:
      - targets: ['host.docker.internal:9101', 'host.docker.internal:9102']
