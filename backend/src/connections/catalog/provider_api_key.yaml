id: provider_api_key
provider: generic
display_name: Your own key for a service HireBuddha uses
category: other
auth_type: api_key
icon: key
status: available
scopes: []
capabilities:
  account_kind: service
  actions: [call_api]
  events: []
  # The business's own key for a provider the platform also integrates (a
  # search API, an email or social API): used instead of the platform's key.
  # WS7 moves a business's old integration_registry rows here.
  form:
    - {name: provider, label: Provider (as in the registry, e.g. serpapi), kind: text, required: true}
    - {name: service_sku, label: Service SKU (optional), kind: text, required: false}
    - {name: model_name, label: Model (optional), kind: text, required: false}
    - {name: api_key, label: API key, kind: secret, required: true}
approval:
  state: not_needed
version: 1
