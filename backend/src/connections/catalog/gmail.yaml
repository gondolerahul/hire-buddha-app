id: gmail
provider: google
display_name: Gmail
category: mail
auth_type: oauth2
icon: gmail
oauth_app_ref: oauth-app-google
status: planned
scopes: [openid, email, "https://www.googleapis.com/auth/gmail.modify"]
capabilities:
  account_kind: user
  disclosure: >-
    HireBuddha will read new mail in this Gmail account so your AI employees can work on it, label the
    messages it has handled, save replies as drafts and send them after a person on your team approves
    each one. It never deletes mail. See how HireBuddha handles Gmail data in its privacy policy.
  after_disconnect: >-
    HireBuddha has revoked its access at Google. You can check it on your Google Account's third-party
    access page (myaccount.google.com/connections).
  actions: [read_mail, send_mail, draft_mail]
  events: [email.received]
approval:
  state: not_submitted
  notes: Restricted Gmail scopes need Google verification and a CASA security assessment.
version: 1
