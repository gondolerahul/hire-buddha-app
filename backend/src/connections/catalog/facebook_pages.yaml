id: facebook_pages
provider: meta
display_name: Facebook Pages
category: social
auth_type: oauth2
icon: facebook
oauth_app_ref: oauth-app-meta
status: planned
scopes: [pages_show_list, pages_manage_posts, pages_read_engagement, pages_read_user_content, pages_manage_engagement, pages_manage_metadata, pages_messaging, read_insights]
capabilities:
  account_kind: page
  disclosure: >-
    HireBuddha will list the Pages you manage and, for the Page you choose, read its posts, comments,
    messages and insights, and publish the posts, comment replies and Messenger answers a person on your
    team approves. Your Page's AI assistant says it is one, and a person can take over. See how HireBuddha
    handles Facebook data, and how to ask for its deletion, in its privacy policy.
  after_disconnect: >-
    HireBuddha has unsubscribed the Page and deleted its token. To remove HireBuddha from your Facebook
    account too, open Facebook, Settings and privacy, Settings, Business integrations.
  actions: [post, reply_to_comment, read_insights, reply_to_message]
  events: [social.comment.created, social.post.created, social.mention.created, social.message.received]
  webhook_object: page
  webhook_fields: [feed, messages]
approval:
  state: not_submitted
  notes: Meta App Review for pages_manage_posts, pages_manage_engagement and pages_messaging.
version: 1
