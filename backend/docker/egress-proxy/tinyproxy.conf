# hb-egress-proxy — default-deny forward proxy for the sandbox (Phase 12 `02`/`06`).
#
# The sandbox container sits on an --internal docker network (no direct
# internet); its only route out is this proxy. FilterDefaultDeny makes the
# allow-list (built at start from $ALLOWLIST, see entrypoint.sh) the ONLY hosts
# reachable. This is the network gate that lets a synthesized / network-using
# tool reach a few approved APIs without handing untrusted code the open
# internet.

User tinyproxy
Group tinyproxy

Port 8888
Listen 0.0.0.0
Timeout 600

# Clients are sandbox containers on the internal network only.
Allow 0.0.0.0/0

# Host allow-list. FilterDefaultDeny => only hosts matching /etc/tinyproxy/filter
# are permitted; everything else is refused.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended On
# Match on the destination host, not the full URL (so HTTPS CONNECT is covered).
FilterURLs Off

# Only allow CONNECT to the standard TLS/HTTP ports.
ConnectPort 443
ConnectPort 80

LogLevel Info
