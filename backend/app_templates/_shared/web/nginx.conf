server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Written at start from the container's environment (40-hb-config.sh).
    location = /config.js {
        alias /tmp/config.js;
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Hashed build output: cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A single-page app: every other path is the app.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
