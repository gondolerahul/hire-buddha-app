# Security headers on the app's pages and assets (SH-E5, GOOG-E9; CASA's baseline).
# Included in each location that serves the app: nginx drops server-level
# add_header lines in a location that adds its own (Cache-Control). /api/ and
# /stream/ carry the API's own headers (src/common/security_headers.py). The
# gateway's routes send HSTS too.
#
# The content policy names every outside host the app uses: Google Fonts, the
# Google Picker (apis.google.com, docs.google.com — GOOG-E4) and Razorpay
# Checkout. A new one is added here, or its script is refused.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), geolocation=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.razorpay.com; frame-src https://docs.google.com https://drive.google.com https://*.razorpay.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
