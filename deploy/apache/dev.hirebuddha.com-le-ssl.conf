<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName dev.hirebuddha.com

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/

    ErrorLog ${APACHE_LOG_DIR}/example-error.log
    CustomLog ${APACHE_LOG_DIR}/example-access.log combined

SSLCertificateFile /etc/letsencrypt/live/dev.hirebuddha.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/dev.hirebuddha.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
