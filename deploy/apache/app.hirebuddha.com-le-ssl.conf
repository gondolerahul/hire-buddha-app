<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName app.hirebuddha.com

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/

    ErrorLog ${APACHE_LOG_DIR}/app-hirebuddha-error.log
    CustomLog ${APACHE_LOG_DIR}/app-hirebuddha-access.log combined

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/app.hirebuddha.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/app.hirebuddha.com/privkey.pem
</VirtualHost>
</IfModule>
<IfModule mod_ssl.c>
<VirtualHost *:80>
    ServerName app.hirebuddha.com

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/

    ErrorLog ${APACHE_LOG_DIR}/app-hirebuddha-error.log
    CustomLog ${APACHE_LOG_DIR}/app-hirebuddha-access.log combined
RewriteEngine on
# Some rewrite rules in this file were disabled on your HTTPS site,
# because they have the potential to create redirection loops.

# RewriteCond %{SERVER_NAME} =app.hirebuddha.com
# RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

</VirtualHost>
</IfModule>
