<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName app.hirebuddha.com

    ProxyPreserveHost On
    ProxyRequests Off

    # Mobile dialer APK (private distribution) — static, served before the Vite proxy
    ProxyPass /download/app/ !
    Alias /download/app/ /var/www/hirebuddha-downloads/app/
    <Directory /var/www/hirebuddha-downloads/app>
        Options -Indexes
        Require all granted
        DirectoryIndex index.html
        AddType application/vnd.android.package-archive .apk
        <FilesMatch "\.apk$">
            Header set Content-Disposition "attachment"
            Header set Cache-Control "no-cache"
        </FilesMatch>
    </Directory>

    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/

    ErrorLog ${APACHE_LOG_DIR}/app-hirebuddha-error.log
    CustomLog ${APACHE_LOG_DIR}/app-hirebuddha-access.log combined

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/app.hirebuddha.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/app.hirebuddha.com/privkey.pem
</VirtualHost>
</IfModule>
