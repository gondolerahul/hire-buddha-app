# =============================================================================
# HireBuddha Platform - Security Configuration
# =============================================================================
# Applied globally to all VirtualHosts via a2enconf.
# Provides:
#   1. Security response headers
#   2. Malicious IP blocking (known attackers from log analysis)
#   3. Path-based attack blocking (LFI, credential harvesting, scanner patterns)
#   4. Rate limiting via mod_evasive
#   5. Request size limits
# =============================================================================

# ---------------------------------------------------------------------------
# 1. Security Headers (requires mod_headers)
# ---------------------------------------------------------------------------
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(self), geolocation=()"
    # Strip server info from responses
    Header always unset X-Powered-By
    Header always unset Server
</IfModule>

# ---------------------------------------------------------------------------
# 2. Block Known Malicious IPs
# ---------------------------------------------------------------------------
# Wrap in <Location "/"> so Require directives are valid in server config.
#
# --- Batch 1: from gateway log analysis 2026-03-16 ---
# 195.3.221.86    - Next.js fingerprinting scanner (70+ recurring requests)
# 107.189.12.131  - VoIP/SIP config scanner (80+ unique paths)
# 195.178.110.160 - Credential/secrets harvester (.env, .aws, .git)
# 130.12.180.52   - Open proxy tester (CONNECT requests)
# 204.76.203.215  - Path traversal attacker (LFI /etc/passwd)
# 204.76.203.73   - Path traversal attacker (LFI /etc/passwd)
# 89.42.231.182   - Path traversal attacker (LFI /etc/passwd)
# 193.32.162.28   - Next.js scanner
# 93.123.109.222  - Fingerprinting scanner
# 178.22.106.230  - Asset probing / phishing kit scanner
#
# --- Batch 2: from gateway log analysis 2026-04-07 ---
# 20.48.232.178   - PHP webshell scanner, xmlrpc (1246 requests, Azure VM)
# 185.177.72.51   - Git/credential harvesting, phpMyAdmin (607 requests)
# 185.177.72.13   - Git/credential harvesting, phpMyAdmin (607 requests)
# 20.104.201.101  - Mixed vulnerability scanning (513 requests, Azure VM)
# 4.193.168.228   - PHP webshell scanner, xmlrpc (313 requests, Azure VM)
# 20.151.229.110  - Mixed vulnerability scanning (252 requests, Azure VM)
# 40.69.27.251    - Mixed vulnerability scanning (250 requests, Azure VM)
# 185.177.72.61   - Git config harvesting (189 requests)
# 68.221.134.12   - PHP webshell scanner (127 requests)
# 74.248.145.211  - Mixed scanning (124 requests)
# 222.89.169.98   - PHPUnit RCE / allow_url_include exploit
# 5.61.209.107    - Hikvision IoT exploit probing
# 31.58.214.23    - AI credential probing (anthropic.json, secrets.py)
# 34.57.159.245   - WordPress fingerprinting (wlwmanifest.xml)
# ---------------------------------------------------------------------------
<Location "/">
    <RequireAll>
        Require all granted
        # Batch 1 (2026-03-16)
        Require not ip 195.3.221.86
        Require not ip 107.189.12.131
        Require not ip 195.178.110.160
        Require not ip 130.12.180.52
        Require not ip 204.76.203.215
        Require not ip 204.76.203.73
        Require not ip 89.42.231.182
        Require not ip 193.32.162.28
        Require not ip 93.123.109.222
        Require not ip 178.22.106.230
        # Batch 2 (2026-04-07)
        Require not ip 20.48.232.178
        Require not ip 185.177.72.51
        Require not ip 185.177.72.13
        Require not ip 20.104.201.101
        Require not ip 4.193.168.228
        Require not ip 20.151.229.110
        Require not ip 40.69.27.251
        Require not ip 185.177.72.61
        Require not ip 68.221.134.12
        Require not ip 74.248.145.211
        Require not ip 222.89.169.98
        Require not ip 5.61.209.107
        Require not ip 31.58.214.23
        Require not ip 34.57.159.245
    </RequireAll>
</Location>

# ---------------------------------------------------------------------------
# 3. Block Malicious Path Patterns (requires mod_rewrite)
# ---------------------------------------------------------------------------
<IfModule mod_rewrite.c>
    RewriteEngine On

    # Block path traversal attempts (LFI attacks targeting /etc/passwd, etc.)
    RewriteCond %{REQUEST_URI} \.\.[/\\] [OR]
    RewriteCond %{THE_REQUEST} \.\.
    RewriteRule .* - [F,L]

    # Block open proxy attempts (CONNECT method)
    RewriteCond %{REQUEST_METHOD} ^CONNECT$ [NC]
    RewriteRule .* - [F,L]

    # Block PHP RCE attempts via query string injection (allow_url_include)
    RewriteCond %{QUERY_STRING} (allow_url_include|auto_prepend_file|php://input) [NC]
    RewriteRule .* - [F,L]
</IfModule>

# Block access to hidden files/directories (.env, .git, .aws, .kube, etc.)
<LocationMatch "^/\.">
    Require all denied
</LocationMatch>

# Block .env files in any subdirectory (e.g. /server/.env, /backend/.env)
<LocationMatch "/[^/]*\.env">
    Require all denied
</LocationMatch>

# Block config/credential files that scanners probe for
<LocationMatch "(config\.(json|php|yml)|docker-compose\.yml|credentials|info\.php|phpinfo)$">
    Require all denied
</LocationMatch>

# Block WordPress scanning (this is not a WP site)
<LocationMatch "^/(wp-login|wp-admin|wp-content|wp-includes|xmlrpc\.php|wlwmanifest\.xml)">
    Require all denied
</LocationMatch>

# Block ALL .php requests — this is a Python/FastAPI app, no PHP served
<LocationMatch "\.php$">
    Require all denied
</LocationMatch>

# Block PHPUnit RCE (CVE-2017-9841) and phpMyAdmin probing
<LocationMatch "^/(vendor/phpunit|phpunit|phpmyadmin|myadmin|pma|dbadmin|mysql|adminer)">
    Require all denied
</LocationMatch>

# Block IoT/Camera exploit probing (Hikvision CVE-2021-36260)
<LocationMatch "^/(SDK/webLanguage|onvif|ISAPI)">
    Require all denied
</LocationMatch>

# Block AI-specific credential harvesting probes
<LocationMatch "(anthropic\.json|openai\.json|secrets\.py|\.openai|api.?keys?)">
    Require all denied
</LocationMatch>

# Block VoIP/SIP provisioning scanners
<LocationMatch "^/(firmware|pbxcfg|yealink|cfgvoip|pap2|devicecfg|telephone|aastra|phconfig|asterisks?|cfgs|cfgsip|provision|polycom|snom|voip|tftpboot|cfgvoice|voipprov|sipphone|tftp|cisco|pbx|gigaset|poly|spa|recording|recordings|macconf|grandstram|panasonic|cfgprov|phone|phones)(/|$)">
    Require all denied
</LocationMatch>

# Block config file extensions commonly probed
<LocationMatch "\.(cfg|bak|old|orig|sql|tar|gz|zip|rar|7z)$">
    Require all denied
</LocationMatch>

# Block service discovery / infrastructure probing
<LocationMatch "^/(solr|v2/_catalog|query|actuator|global/health|cgi-bin|console|debug|trace)">
    Require all denied
</LocationMatch>

# Block common upload/shell directories
<LocationMatch "^/(uploads|shell|cmd|c99|r57|webshell)(/|$)">
    Require all denied
</LocationMatch>

# ---------------------------------------------------------------------------
# 4. mod_evasive - Rate Limiting / DDoS Protection
# ---------------------------------------------------------------------------
<IfModule mod_evasive20.c>
    # Max requests to the SAME page per page interval (per IP)
    # Raised from 5 to 15 — SPA HMR can poll the same endpoint rapidly
    DOSPageCount        15
    DOSPageInterval     1

    # Max requests to ANY page per site interval (per IP)
    # Raised from 50 to 100 — Vite dev server loads 30-50 modules per page load
    DOSSiteCount        100
    DOSSiteInterval     1

    # How long (seconds) an IP is blocked after triggering limits
    DOSBlockingPeriod   300

    # Log directory for tracking blocked IPs
    DOSLogDir           "/var/log/apache2/mod_evasive"

    # Whitelist localhost and internal network IPs
    DOSWhitelist        127.0.0.1
    DOSWhitelist        10.160.0.*
    DOSWhitelist        172.21.0.*
    # Admin / known user IPs
    DOSWhitelist        152.56.13.*
</IfModule>

# ---------------------------------------------------------------------------
# 5. Request Size Limits (prevent oversized payloads)
# ---------------------------------------------------------------------------
# Limit request body to 10MB (adjust if file uploads need more)
LimitRequestBody 10485760

# Limit request header fields
LimitRequestFields 100
LimitRequestFieldSize 8190
LimitRequestLine 8190
