<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName gateway.hirebuddha.com

    ProxyPreserveHost On
    ProxyRequests Off

    # ===== WebSocket Proxy (MUST come before regular proxy) =====
    # Handle WebSocket upgrade requests for audio/video streaming
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /stream/(.*) ws://127.0.0.1:8001/stream/$1 [P,L]

    # Handle Tata Tele WebSocket paths (audio streaming after webhook)
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /webhooks/voice/tata/(.*) ws://127.0.0.1:8001/webhooks/voice/tata/$1 [P,L]

    # Increase timeouts for long-lived WebSocket connections
    ProxyTimeout 86400

    # ===== Regular HTTP Proxy =====
    ProxyPass / http://localhost:8001/
    ProxyPassReverse / http://localhost:8001/

    ErrorLog ${APACHE_LOG_DIR}/example-error.log
    CustomLog ${APACHE_LOG_DIR}/example-access.log combined

SSLCertificateFile /etc/letsencrypt/live/gateway.hirebuddha.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/gateway.hirebuddha.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
