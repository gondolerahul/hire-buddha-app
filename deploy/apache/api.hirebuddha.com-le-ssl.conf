<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName api.hirebuddha.com

    ProxyPreserveHost On
    ProxyRequests Off

    # The API sees plain HTTP from Apache; keep its redirects on https.
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass / http://localhost:8000/
    ProxyPassReverse / http://localhost:8000/

    ErrorLog ${APACHE_LOG_DIR}/example-error.log
    CustomLog ${APACHE_LOG_DIR}/example-access.log combined

SSLCertificateFile /etc/letsencrypt/live/gateway.hirebuddha.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/gateway.hirebuddha.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
