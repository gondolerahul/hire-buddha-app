name: deploy-azure

# Phase 14 WS0 0.5, decision D51 (owner, 21 Oct 2026): no staging. A push to
# main — or, while Phase 14 stays off main (D46), to
# roadmap-development-defect-fixes — runs the tests (ci.yml), builds the
# platform images once, pushes them to dev's registry and rolls them out on
# Azure dev. Production then gets the same images: its job waits for a required
# reviewer in the GitHub environment `azure-prod`, copies the images dev ran
# (same tag and digest) from dev's registry into production's, and rolls them
# out. Database migrations run in each release's migrations Job.
# No Azure secret is stored: azure/login exchanges the workflow's OIDC token
# for the id-hb-<env>-ci identity (Azure setup guide §15.1).
#
# GitHub environments azure-dev and azure-prod each hold the variables
# AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, ACR_NAME, AKS_NAME,
# AKS_RESOURCE_GROUP; azure-prod also SOURCE_ACR_NAME (dev's registry, which
# production's CI identity may read: Bicep promotionSourceRegistry) and its
# required reviewers. Repository variables turn the jobs on once the
# environments exist: AZURE_DEPLOY_ENABLED=true (dev), AZURE_PROD_ENABLED=true
# (production); until then they are skipped, not failed.

on:
  push:
    branches: [main, roadmap-development-defect-fixes]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/k8s/**"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One rollout per environment at a time, in order. Not one lock for the whole run:
# a production job waiting for its reviewer held it, so every later push waited
# (hours) before even its tests ran.

env:
  # Every image of a release, one tag: the platform's, and the tenant runtime's (WS6, slice 4).
  IMAGES: >-
    hb-api hb-worker hb-child-worker hb-event-worker hb-scheduler hb-backup hb-frontend
    hb-sandbox hb-checks hb-egress-proxy hb-caddy-redis hb-app-controller

jobs:
  # The tests gate every deploy: a push that fails them builds and deploys nothing.
  # They run even while deploys are off, so a push to the Phase 14 branch is tested.
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    # Environment variables are not visible to a job's `if`; this one is the repository's.
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: azure-dev
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: hb-api, context: backend, target: api }
          - { image: hb-worker, context: backend, target: worker }
          - { image: hb-child-worker, context: backend, target: child-worker }
          - { image: hb-event-worker, context: backend, target: event-worker }
          - { image: hb-scheduler, context: backend, target: scheduler }
          - { image: hb-backup, context: backend, target: backup }
          - { image: hb-frontend, context: frontend, target: runtime }
          # Tenant runtime (WS6, slice 4).
          - { image: hb-sandbox, context: backend/docker/sandbox/stage, target: "" }
          - { image: hb-checks, context: backend, target: "", file: backend/docker/checks/Dockerfile }
          - { image: hb-egress-proxy, context: backend/docker/egress-proxy, target: "" }
          - { image: hb-caddy-redis, context: backend/docker/caddy-redis, target: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Stage the sandbox image's context (its Dockerfile, agent and the Document Factory scripts)
        if: matrix.image == 'hb-sandbox'
        run: |
          set -euo pipefail
          stage=backend/docker/sandbox/stage
          mkdir -p "$stage/docfactory"
          cp backend/docker/sandbox/{Dockerfile,requirements.txt,agent.py} "$stage/"
          cp -R backend/scripts/seeds/default_entities/SeedDocumentFactory/scripts "$stage/docfactory/scripts"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Registry login
        run: az acr login --name "${{ vars.ACR_NAME }}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ vars.ACR_NAME }}.azurecr.io/${{ matrix.image }}:${{ github.sha }}
          # The backend targets share every layer up to "runtime".
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}
          provenance: true
          sbom: true
      # SH-E5 / GOOG-E9: the image as pushed, scanned for known vulnerabilities in
      # its OS packages and libraries. Listed in the job summary; the CI security
      # job is the one that fails a build (docs/phase15/14_connector_approvals/13).
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0, pinned by commit
        with:
          image-ref: ${{ vars.ACR_NAME }}.azurecr.io/${{ matrix.image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
          output: trivy-${{ matrix.image }}.txt
      - name: Image scan summary
        if: always()
        run: |
          if [ -f "trivy-${{ matrix.image }}.txt" ]; then
            { echo "### ${{ matrix.image }}: HIGH and CRITICAL with a fix"; echo '```'; cat "trivy-${{ matrix.image }}.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The App Controller is the release's API image plus kopf (services/app_controller/Dockerfile).
  app-controller:
    needs: images
    runs-on: ubuntu-latest
    environment: azure-dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Registry login
        run: az acr login --name "${{ vars.ACR_NAME }}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/services/app_controller/Dockerfile
          build-args: BASE=${{ vars.ACR_NAME }}.azurecr.io/hb-api:${{ github.sha }}
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/hb-app-controller:${{ github.sha }}
          provenance: true
          sbom: true

  dev:
    needs: [images, app-controller]
    runs-on: ubuntu-latest
    environment: azure-dev
    concurrency:
      group: deploy-dev-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rollout
        with:
          env-name: dev
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          acr-name: ${{ vars.ACR_NAME }}
          aks-name: ${{ vars.AKS_NAME }}
          aks-resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          image-tag: ${{ github.sha }}

  # Waits for a required reviewer of azure-prod (D51), then deploys what dev runs.
  prod:
    needs: dev
    if: ${{ vars.AZURE_PROD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: azure-prod
    # A newer push's production job replaces an older one still queued behind it.
    concurrency:
      group: deploy-prod-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/setup-buildx-action@v3
      - name: Copy dev's images into production's registry (same digests)
        env:
          SOURCE: ${{ vars.SOURCE_ACR_NAME }}
          TARGET: ${{ vars.ACR_NAME }}
          TAG: ${{ github.sha }}
          TENANT: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          az acr login --name "$TARGET"
          # Dev's registry is in another subscription: production's CI identity
          # holds only AcrPull there, so sign in on its data plane with an Entra token.
          aad=$(az account get-access-token --query accessToken -o tsv)
          refresh=$(curl -fsS -X POST "https://$SOURCE.azurecr.io/oauth2/exchange" \
            -d grant_type=access_token -d "service=$SOURCE.azurecr.io" -d "tenant=$TENANT" \
            --data-urlencode "access_token=$aad" | jq -r .refresh_token)
          echo "$refresh" | docker login "$SOURCE.azurecr.io" -u 00000000-0000-0000-0000-000000000000 --password-stdin
          for image in $IMAGES; do
            docker buildx imagetools create \
              --tag "$TARGET.azurecr.io/$image:$TAG" "$SOURCE.azurecr.io/$image:$TAG"
          done
      - uses: ./.github/actions/rollout
        with:
          env-name: prod
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          acr-name: ${{ vars.ACR_NAME }}
          aks-name: ${{ vars.AKS_NAME }}
          aks-resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          image-tag: ${{ github.sha }}
